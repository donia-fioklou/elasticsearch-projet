# Charge automatiquement les variables du fichier .env
# (crée .env à partir de .env.example et mets ta clé TMDB)

services:

  # ─────────────────────────────────────────
  # Elasticsearch
  # ─────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: elasticsearch
    environment:
      - node.name=es-node
      - cluster.name=es-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - movies-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cat/health?h=status | grep -E 'green|yellow'"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s

  # ─────────────────────────────────────────
  # Kibana
  # ─────────────────────────────────────────
  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    networks:
      - movies-net

  # ─────────────────────────────────────────
  # Setup : crée l'index ES au démarrage
  # S'exécute une seule fois puis s'arrête
  # ─────────────────────────────────────────
  setup-index:
    build:
      context: ./movies-app
    container_name: setup-index
    command: python setup_index.py
    environment:
      - ES_URL=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - movies-net
    restart: "no"         # Se lance une fois, ne redémarre pas

  # ─────────────────────────────────────────
  # Import TMDB : fetch + indexation des films
  # Lance manuellement avec :
  #   docker-compose run --rm fetch-tmdb
  # ─────────────────────────────────────────
  fetch-tmdb:
    build:
      context: ./movies-app
    container_name: fetch-tmdb
    command: python fetch_tmdb.py
    environment:
      - ES_URL=http://elasticsearch:9200
      - TMDB_API_KEY=${TMDB_API_KEY}   # Lue depuis le fichier .env
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - movies-net
    profiles:
      - import       # Désactivé par défaut, lancé manuellement

  # ─────────────────────────────────────────
  # Application Flask (frontend + API)
  # ─────────────────────────────────────────
  movies-app:
    build:
      context: ./movies-app
    container_name: movies-app
    ports:
      - "5000:5000"
    environment:
      - ES_URL=http://elasticsearch:9200
      - FLASK_ENV=production
    depends_on:
      elasticsearch:
        condition: service_healthy
      setup-index:
        condition: service_completed_successfully
    networks:
      - movies-net
    restart: unless-stopped

# ─────────────────────────────────────────
# Réseau partagé entre tous les services
# ─────────────────────────────────────────
networks:
  movies-net:
    driver: bridge

# ─────────────────────────────────────────
# Volume persistant pour les données ES
# ─────────────────────────────────────────
volumes:
  es_data:
